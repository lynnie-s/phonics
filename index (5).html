<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tr. Jasmine的發音與拼音法寶</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F9FF; --card:#FFFFFF; --ink:#1B2447; --mute:#5C6A8C; --line:#DCE5F5;
  --star:#FFB400; --ok:#2FA84F; --okbg:#DDF5E3; --no:#E5484D; --nobg:#FFE3E4;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Andika,"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-tap-highlight-color:transparent}
button,a{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:12px}
header{display:flex;align-items:center;gap:14px;padding:16px 22px;max-width:1000px;margin:0 auto}
header h1{margin:0;font-size:1.35rem;font-weight:700;letter-spacing:.01em;cursor:pointer;display:flex;align-items:center;gap:10px}
.logo{display:flex;gap:3px}
.logo i{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font:700 .8rem Andika,sans-serif;color:#fff;font-style:normal;box-shadow:0 2px 0 rgba(0,0,0,.22)}
.stars{margin-left:auto;font-weight:700;display:flex;align-items:center;gap:6px;color:var(--mute)}
.stars svg{width:20px;height:20px;fill:var(--star)}
main{max-width:1000px;margin:0 auto;padding:6px 22px 48px}
h2{font-size:1.15rem;font-weight:700;margin:14px 0 18px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:20px}
.unit{--c:#333;--on:#fff;background:var(--c);color:var(--on);border-radius:20px;padding:22px 16px 18px;text-align:left;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 0 color-mix(in srgb,var(--c) 80%,#000);transition:transform .1s,box-shadow .1s}
.unit:active{transform:translateY(5px);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 1px 0 color-mix(in srgb,var(--c) 80%,#000)}
.unit .g{font-size:3.6rem;font-weight:700;line-height:1;letter-spacing:-.01em}
.unit .n{font-size:1.05rem;font-weight:700}
.unit small{display:block;font-weight:400;opacity:.82;font-size:.85rem}
.back{padding:8px 14px;margin:6px 0 4px -14px;color:var(--mute);font-weight:500;border-radius:12px}
.back:hover{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 22px}
.chip{min-width:46px;padding:8px 14px;font-weight:700;font-size:1.05rem;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.chip.on{background:var(--c);border-color:var(--c);color:var(--on)}
.stage{--c:#333}
.head{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.blk{min-width:112px;height:112px;padding:0 18px;border-radius:22px;background:var(--c);color:var(--on);display:grid;place-items:center;font-size:3.4rem;font-weight:700;line-height:1;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 7px 0 color-mix(in srgb,var(--c) 80%,#000)}
.blk{cursor:pointer;transition:transform .1s,box-shadow .1s}
.blk:active{transform:translateY(6px);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 1px 0 color-mix(in srgb,var(--c) 80%,#000)}
.hint{color:var(--mute);font-size:.9rem;margin:14px 0 0}
.acts{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:14px;font-weight:700;text-decoration:none;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.btn.fill{background:var(--c);border-color:var(--c);color:var(--on)}
.btn:active{transform:translateY(2px)}
.btn svg{width:18px;height:18px;fill:currentColor}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:34px}
.w{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 10px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);transition:border-color .12s,background .12s}
.w:hover{border-color:var(--c)}
.w:active{background:color-mix(in srgb,var(--c) 10%,var(--card))}
.w .e{width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#fff;display:grid;place-items:center}
.w .e img{width:100%;height:100%;object-fit:contain;display:block}
.w .e i{font:700 1.7rem Andika,sans-serif;font-style:normal;color:color-mix(in srgb,var(--c) 82%,#000)}
.w .t{font-size:1.3rem;font-weight:700}
.w .t b{color:color-mix(in srgb,var(--c) 82%,#000)}
.q{text-align:center;max-width:620px;margin:0 auto}
.q .cnt{color:var(--mute);font-weight:500}
.q .hear{width:104px;height:104px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;margin:22px auto 8px;box-shadow:0 6px 0 #000}
.q .hear:active{transform:translateY(5px);box-shadow:0 1px 0 #000}
.q .hear svg{width:42px;height:42px;fill:#fff}
.q p{color:var(--mute);margin:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:26px}
.opts button{font-size:1.45rem;font-weight:700;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:22px 8px}
.opts button:hover{border-color:var(--ink)}
.opts button.ok{background:var(--okbg);border-color:var(--ok)}
.opts button.no{background:var(--nobg);border-color:var(--no)}
.msg{min-height:2rem;font-size:1.2rem;margin-top:16px;font-weight:700}
.res .big{font-size:2.6rem;color:var(--star);letter-spacing:.1em;margin:10px 0}
.res h2{color:var(--ink);font-size:1.6rem}
@media (max-width:520px){header{padding:14px 16px}main{padding:4px 16px 40px}.grid{gap:14px}.blk{min-width:92px;height:92px;font-size:2.8rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

header{position:static}
#nav{position:sticky;top:0;z-index:20;display:flex;gap:8px;overflow-x:auto;padding:10px 22px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);scrollbar-width:none;max-width:none}
#nav::-webkit-scrollbar{display:none}
#nav a{flex:none;text-decoration:none;font-weight:700;font-size:.95rem;padding:7px 14px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
#nav a:hover{border-color:var(--c,var(--ink))}
#nav a.tut{background:var(--ink);color:#fff;border-color:var(--ink)}
section{scroll-margin-top:64px;margin-top:44px}
section>h2{font-size:1.6rem;color:var(--ink);margin:0 0 6px;padding-bottom:10px;border-bottom:3px solid var(--c)}
.grp{margin-top:34px}
.grp .words{margin-top:20px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(27,36,71,.55);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.mcard{position:relative;background:var(--card);border-radius:24px;padding:28px 22px;width:min(560px,100%);max-height:92vh;overflow:auto}
.mx{position:absolute;top:10px;right:14px;font-size:2rem;line-height:1;color:var(--mute);padding:4px 10px;border-radius:12px}
.blk.sm{font-size:1.7rem;height:auto;min-height:84px;padding:14px 22px}
.tutor{--c:var(--ink);--on:#fff;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 24px;margin-bottom:40px}
.tutor>h2{border-bottom:0;margin-bottom:14px;padding-bottom:0}
.tutor .lead{color:var(--mute);margin:6px 0 14px}
.tutor ul{margin:0 0 22px;padding-left:20px}
.tutor li{margin:6px 0}
@media (max-width:520px){#nav{padding:10px 16px}header h1{font-size:1.02rem;gap:8px}header{gap:8px}.logo i{width:17px;height:17px}}
</style>
</head>

const UNITS=[];
raw.trim().split('\n').forEach(l=>{const p=l.split('|');
  if(p.length==4){UNITS.push({id:p[0],icon:p[1],name:p[2],color:p[3],items:[]});}
  else{const w=p[1].split(' ').map(x=>x.replace(/_/g,' '));UNITS.at(-1).items.push({p:p[0],words:w});}});
(function(){const c=UNITS.find(u=>u.id=='consonants');
  const V=['Aa','Ee','Ii','Oo','Uu'];
  const vow={id:'vowels',icon:'a',name:'Vowels: A E I O U',color:'#E8744F',items:c.items.filter(i=>V.includes(i.p))};
  c.items=c.items.filter(i=>!V.includes(i.p));
  UNITS.splice(1,0,vow);
  [c,vow].forEach(u=>u.items.forEach(i=>i.video=VIDEO[i.p[0].toLowerCase()]));})();
UNITS.find(u=>u.id=='short').items.forEach(i=>i.video=VIDEO[i.p[0].toLowerCase()]);
const ALL=[...new Set(UNITS.flatMap(u=>u.items.flatMap(i=>i.words)))];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const app=$('#app');
function say(t,rate=.8){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate;speechSynthesis.speak(u);}catch(e){}}
const store={get:()=>{try{return JSON.parse(localStorage.getItem('phonics')||'{}')}catch(e){return{}}},set:o=>{try{localStorage.setItem('phonics',JSON.stringify(o))}catch(e){}}};
function totalStars(){return Object.values(store.get()).reduce((a,b)=>a+b,0)}
function updStars(){$('#stars').textContent=totalStars()}
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function hl(word,pat){
  const key=pat.split(' ')[0].toLowerCase().replace(/[^a-z_]/g,'');
  if(!key||key.length<2||key.includes('_'))return word;
  const i=word.toLowerCase().indexOf(key);
  return i<0?word:word.slice(0,i)+'<b>'+word.slice(i,i+key.length)+'</b>'+word.slice(i+key.length);
}

/* ---------- view ---------- */
function onc(h){const n=parseInt(h.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return (0.299*r+0.587*g+0.114*b)>165?'#1B2447':'#fff'}
const LNAME={a:'ay',b:'bee',c:'see',d:'dee',e:'ee',f:'eff',g:'jee',h:'aitch',i:'eye',j:'jay',k:'kay',l:'ell',m:'em',n:'en',o:'oh',p:'pee',q:'cue',r:'are',s:'ess',t:'tee',u:'you',v:'vee',w:'double you',x:'ex',y:'why',z:'zee'};
function sayLetter(it){const c=it.p[0].toLowerCase();say(LNAME[c],.7)}
function pic(w){return `<img src="img/${w.toLowerCase().replace(/ /g,'_')}.jpg" alt="${w}" loading="lazy">`}
const SPK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
const PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const TUTOR_EMAIL='chi.chin0929@gmail.com';

function lev(a,b){a=a.toLowerCase();b=b.toLowerCase();const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return d[a.length][b.length]}
function similar(w){
  const seen=new Set([w.toLowerCase()]);
  const pool=ALL.filter(x=>{const k=x.toLowerCase();if(seen.has(k)||x.includes(' '))return false;seen.add(k);return true;})
    .map(x=>({x,score:lev(w,x)+Math.random()*1.2})).sort((a,b)=>a.score-b.score);
  return pool.slice(0,2).map(o=>o.x);
}

/* ---------- page ---------- */
function build(){
  $('#nav').innerHTML=UNITS.map(u=>`<a href="#s-${u.id}" style="--c:${u.color}">${u.name.replace(': A E I O U','')}</a>`).join('')+'<a href="#tutoring" class="tut">Tutoring</a>';
  app.innerHTML=UNITS.map((u,ui)=>`
  <section id="s-${u.id}" style="--c:${u.color};--on:${onc(u.color)}">
    <h2>${u.name}</h2>
    ${u.items.map((it,ii)=>`
    <article class="grp">
      <div class="head">
        ${u.id=='consonants'?`<button class="blk" data-letter="${ui}:${ii}" aria-label="Hear the letter name">${it.p}</button>`:`<div class="blk nb${it.p.length>4?' sm':''}">${it.p.replace('_','·')}</div>`}
        <div class="acts">
          <button class="btn fill" data-hear="${ui}:${ii}">${SPK}Hear words</button>
          <button class="btn" data-quiz="${ui}:${ii}">Quiz</button>
          ${it.video?`<a class="btn" href="https://www.youtube.com/shorts/${it.video}" target="_blank" rel="noopener">${PLAY}Alphablocks video</a>`:''}
        </div>
      </div>
      <div class="words">${it.words.map(w=>`<button class="w" data-w="${w}"><span class="e">${pic(w)}</span><span class="t">${hl(w,it.p)}</span></button>`).join('')}</div>
    </article>`).join('')}
  </section>`).join('')+`
  <section id="tutoring" class="tutor">
    <h2>Private English Tutoring</h2>
    <ul>
      <li>GEPT (General English Proficiency Test)</li>
      <li>Elementary school, junior high and senior high entrance exams</li>
      <li>TOEFL</li>
      <li>IELTS</li>
    </ul>
    <a class="btn fill" href="mailto:${TUTOR_EMAIL}">Email: ${TUTOR_EMAIL}</a>
  </section>`;
}
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-w],[data-hear],[data-quiz],[data-letter]');if(!t)return;
  const get=k=>{const [u,i]=t.dataset[k].split(':').map(Number);return [UNITS[u],UNITS[u].items[i]]};
  if(t.dataset.w)say(t.dataset.w);
  else if(t.dataset.letter){const [,it]=get('letter');sayLetter(it)}
  else if(t.dataset.hear){const [,it]=get('hear');let k=0;const go=()=>{if(k>=it.words.length)return;say(it.words[k++]);setTimeout(go,1300)};go()}
  else if(t.dataset.quiz){const [u,it]=get('quiz');quiz(u,it)}
});

/* ---------- quiz (popup) ---------- */
const modal=$('#modal'),mbody=$('#mbody');
function closeQuiz(){modal.hidden=true;mbody.innerHTML='';try{speechSynthesis.cancel()}catch(e){}document.body.style.overflow=''}
$('#mclose').onclick=closeQuiz;
modal.addEventListener('click',e=>{if(e.target===modal)closeQuiz()});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&!modal.hidden)closeQuiz()});
function quiz(u,it){
  modal.hidden=false;document.body.style.overflow='hidden';
  modal.style.setProperty('--c',u.color);modal.style.setProperty('--on',onc(u.color));
  const qs=shuffle(it.words).slice(0,5);let n=0,score=0,locked=false;
  const show=()=>{
    if(n>=qs.length){
      const s=store.get(),key=u.id+':'+it.p;s[key]=Math.max(s[key]||0,score);store.set(s);updStars();
      mbody.innerHTML=`<div class="q res"><h2>${score>=4?'Great job!':'Keep practicing!'}</h2><div class="big">${'★'.repeat(score)||'·'}</div><p>Score ${score} / ${qs.length}</p>
      <div class="acts" style="justify-content:center;margin-top:24px"><button class="btn fill" id="again">Play again</button><button class="btn" id="done">Close</button></div></div>`;
      $('#again').onclick=()=>quiz(u,it);$('#done').onclick=closeQuiz;return;}
    const w=qs[n];
    const opts=shuffle([w,...similar(w)]);
    mbody.innerHTML=`<div class="q"><div class="cnt">Question ${n+1} / ${qs.length} · ${it.p.replace('_','·')}</div>
      <button class="hear" id="hear" aria-label="Hear again">${SPK}</button><p>Listen and choose the word</p>
      <div class="opts">${opts.map(o=>`<button data-o="${o}">${o}</button>`).join('')}</div><div class="msg" id="msg"></div></div>`;
    $('#hear').onclick=()=>say(w);setTimeout(()=>say(w),300);locked=false;
    mbody.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{
      if(locked)return;
      if(b.dataset.o==w){locked=true;b.classList.add('ok');score++;$('#msg').textContent='Correct!';say(w);setTimeout(()=>{n++;show()},1200);}
      else{b.classList.add('no');$('#msg').textContent='Try again!';say(w);}
    });
  };
  show();
}
$('#home').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
$('#home').onkeydown=e=>{if(e.key=='Enter')window.scrollTo({top:0,behavior:'smooth'})};
build();updStars();
</script>
